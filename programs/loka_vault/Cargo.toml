[package]
name = "loka_vault"
version = "0.1.0"
description = "Sandbox payment vault for LOKA Pay"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "loka_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# Anchor SPL 1.1.2 references token_interface unconditionally while generating IDL.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "associated_token"] }
solana-sha256-hasher = { version = "=3.0.0", features = ["sha2"] }
solana-instructions-sysvar = "=3.0.1"

[dev-dependencies]
serde_json = "=1.0.149"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
