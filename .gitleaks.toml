# gitleaks config: the default rules plus one narrow, reviewed exception.
title = "loka-pay"

[extend]
useDefault = true

# protocol/vectors/payment-v1.json is generated by tools/vectors/gen.mjs (CI fails if it
# drifts). Its *KeyHashHex fields are sha256 hashes of PUBLIC test keys derived from
# public labels; the default generic-api-key rule flags them only because the field
# name contains "key". Both conditions must hold: that exact file AND that field shape.
[[allowlists]]
description = "public key hashes in the generated payment test vectors"
condition = "AND"
paths = ['''^protocol/vectors/payment-v1\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(payee|payer|merchant)?[kK]eyHashHex": "[0-9a-f]{64}",?$''']
