# gitleaks config: the default rules plus one narrow, reviewed exception.
title = "loka-pay"

[extend]
useDefault = true

# protocol/vectors/payment-v1.json is generated by tools/vectors/gen.mjs (CI fails if it
# drifts). Its *KeyHashHex fields hold sha256 hashes of three PUBLIC test keys derived
# from public labels (payer, merchant-a, merchant-b); the default generic-api-key rule
# flags them only because the field name contains "key". The exception lists those three
# exact values, so any other value in that file, now or in history, is still reported.
# If the generator's test keys ever change, update these values after reviewing them.
[[allowlists]]
description = "the three public test key hashes in the generated payment vectors"
condition = "AND"
paths = ['''^protocol/vectors/payment-v1\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"(payee|payer|merchant)?[kK]eyHashHex": "(b73cfc5a01d7a1cca3e0d6da89967795d0b30588192a8943c3d266eafedf73df|3f895a02c4c680bb5f2db66fc95e1b7d9ab3a2a4b26b0242b204cf6c98ca8092|f64e5dc9defe67156dfb1c328385a78d4cffab0d2fb3f4cc4a11fbc1112609cd)",?$''',
]
