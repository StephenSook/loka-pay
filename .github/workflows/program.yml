# program.yml: the loka_vault Anchor program, tested on a local validator after
# asserting that the secp256r1 precompile feature is active there.
# All payments use a fresh local ledger. No deploy credentials or faucet calls.
name: program

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: program-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  program:
    name: program (secp256r1 feature check, anchor test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOLANA_VERSION: 3.1.10
      ANCHOR_VERSION: 1.1.2
    steps:
      - uses: actions/checkout@v4

      - name: Refuse an unpinned toolchain
        run: |
          case "${SOLANA_VERSION}${ANCHOR_VERSION}" in
            *TODO*) echo "::error::pin SOLANA_VERSION and ANCHOR_VERSION from programs/TOOLCHAIN.md (task 0.4)"; exit 1 ;;
          esac

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.avm
            ~/.local/share/solana
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install the Solana CLI (Agave)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/solana-install.sh" "https://release.anza.xyz/v${SOLANA_VERSION}/install"
          sh "$RUNNER_TEMP/solana-install.sh"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor through avm
        run: |
          set -euo pipefail
          if ! command -v avm > /dev/null; then
            cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" avm --locked
          fi
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      - name: Toolchain versions
        run: |
          solana --version
          anchor --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install locked dependencies and prepare a local test wallet
        working-directory: programs
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          bash scripts/prepare-local-wallet.sh

      - name: Build, typecheck and test the Rust vectors
        working-directory: programs
        run: |
          cargo fmt --all --check
          pnpm typecheck
          node --test scripts/initialize-vault.test.mjs
          anchor build --ignore-keys
          cargo test --locked -p loka_vault
          diff -u idl/loka_vault.json target/idl/loka_vault.json

      - name: Assert the secp256r1 precompile feature is active on the local validator
        run: bash programs/scripts/assert-secp256r1-active.sh

      - name: anchor test
        working-directory: programs
        run: anchor test --skip-build --validator legacy
