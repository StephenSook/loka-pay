# hygiene.yml: secret scan over the full history, the scrub guard (patterns only,
# never literal values), the prose gate on every line added since the foundation,
# the no-tracking guard and the FACTS equality check.
# Draft from the pre-event kit. Each TODO names the task that fills it in.
# Gates run bare: no pipe on any exit path.
name: hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene:
    name: hygiene (gitleaks, scrub guard, prose gate, FACTS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags: gitleaks and the prose-gate base need both

      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.30.1  # the version used for the pre-event scan
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # TODO(1.7): pin the archive's sha256 from the release checksums and verify it here.
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-banner --redact

      - name: Scrub guard (home paths, device serials and ids, foreign Apple team ids, key shapes)
        env:
          # Our Apple team id is not a secret; set it as a repository variable (PLAN.md H25).
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::set the repository variable APPLE_TEAM_ID so the guard can tell our team id from a foreign one"
            exit 1
          fi
          # --git-tree HEAD: sweep exactly the committed files, read from git objects.
          # uuid and hex40 catch device identifiers; protocol constants of the same shape
          # are allowlisted by exact value in tools/scrub/allowlist.tsv.
          python3 tools/scrub/scrub_sweep.py . --git-tree HEAD --allow-team "$APPLE_TEAM_ID" \
            --allowlist tools/scrub/allowlist.tsv --fail-on-hits \
            --only home_path,adb_serial,uuid,hex40,dev_team,private_key,aws_access_key,sk_key,jwt,mac_address,phone_e164

      - name: Prose gate (no em or en dashes in added lines; AI-tone words in added markdown)
        run: |
          set -euo pipefail
          base="$(git rev-parse -q --verify 'refs/tags/pre-hacklanta-foundation^{commit}' || git rev-parse --verify 'refs/tags/pre-hacklanta-kit^{commit}')"
          python3 tools/hygiene/prose_gate.py --base "$base"

      - name: No analytics or tracking (task 3.55; /privacy says there is none)
        run: |
          set -euo pipefail
          python3 tools/hygiene/no_tracking.py
          python3 -m unittest tools/hygiene/test_no_tracking.py -v

      - name: EXP-PAY-001 measurement decoder and classifier (task 3.6; recorded fixtures, no network)
        run: |
          set -euo pipefail
          python3 -m unittest tools/measure/test_exp_pay_001.py -v

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tools/vectors/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            tools/vectors/pnpm-lock.yaml
            protocol/lib/pnpm-lock.yaml

      - name: Payment vectors are fresh (protocol/vectors/payment-v1.json equals the generator)
        run: |
          set -euo pipefail
          pnpm --dir tools/vectors install --frozen-lockfile
          pnpm --dir tools/vectors run check

      - name: Protocol library agrees with the vectors (protocol/lib)
        run: |
          set -euo pipefail
          pnpm --dir protocol/lib install --frozen-lockfile
          pnpm --dir protocol/lib test
          pnpm --dir protocol/lib typecheck

      - name: FACTS equality (every judge-facing number equals docs/FACTS.json)
        # Task 4.2: schema, web/lib/facts.ts and README.md against docs/FACTS.json. It runs
        # unconditionally: a missing checker fails here instead of skipping. Slides, video and
        # Devpost live outside the repo. Run it with --strict before submission.
        run: |
          set -euo pipefail
          python3 tools/facts/check_facts.py

      - name: FACTS check tests (each planted drift turns the check red)
        run: |
          set -euo pipefail
          python3 -m unittest tools/facts/test_check_facts.py -v
