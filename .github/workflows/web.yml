# web.yml: the judge site: lint, typecheck, build, Playwright.
# Draft from the pre-event kit. Each TODO names the task that fills it in.
# Gates run bare: no pipe on any exit path. This job stays red until web/ exists
# (task 1.8); make it a required check once it is green (task 1.7).
# Production checks (no-login judge path on the deployed origin) belong to the
# scheduled probe, tracked apart from this verdict.
name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: web (lint, typecheck, build, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # TODO(1.8): match "packageManager" in web/package.json.
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        # TODO(1.8): script name from web/package.json (for example "tsc --noEmit").
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Playwright (local build)
        # TODO(1.8): web/e2e/judge.spec.ts covers the no-login judge path.
        run: pnpm exec playwright test

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
